[package]
name = "light-program-profiler"
version.workspace = true
edition.workspace = true
description = "Profiler macros with custom profiler syscalls for Solana programs"
license = "Apache-2.0"
repository = "https://github.com/Lightprotocol/light-program-profiler"
homepage = "https://github.com/Lightprotocol/light-program-profiler"

[features]
profile-program = ["light-profiler-macro/profile-program"]
profile-heap = ["light-profiler-macro/profile-heap"]
inline = ["light-profiler-macro/inline"]
report = []
mollusk = ["dep:solana-program-runtime", "dep:mollusk-svm", "dep:solana-hash", "report"]

[dependencies]
light-profiler-macro.workspace = true
solana-program-runtime = { version = "4.2", optional = true }
mollusk-svm = { version = "0.15.0", optional = true }
# Pin solana-hash to the 4.5 line so its wincode 0.5 dependency aligns with the
# rest of the agave 4.2 graph; 4.6.0 pulls in wincode 0.6 and breaks solana-nonce.
solana-hash = { version = "=4.5.0", optional = true }

[dev-dependencies]
solana-instruction = "3.4"
solana-pubkey = "4.2"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
